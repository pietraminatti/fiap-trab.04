name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  pipeline:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Executar monitoramento multimodal (offline)
        run: python run_multimodal_monitoring.py --offline
      - name: Validar detecções contra o ground truth
        run: |
          python - <<'PY'
          import json, sys
          r = json.load(open("reports/resultados.json", encoding="utf-8"))
          for c in r["avaliacao"]:
              print(("OK     " if c["ok"] else "FALHOU ") + c["verificacao"] + " -> " + c["resultado"])
          sys.exit(0 if all(c["ok"] for c in r["avaliacao"]) else 1)
          PY
      - name: Resumo no GitHub
        run: |
          echo "## Painel de alertas" >> "$GITHUB_STEP_SUMMARY"
          head -n 40 reports/painel_alertas.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: relatorios-fase4
          path: reports/

  azure:
    needs: test
    runs-on: ubuntu-latest
    env:
      AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
      AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
      AZURE_LANGUAGE_KEY: ${{ secrets.AZURE_LANGUAGE_KEY }}
      AZURE_LANGUAGE_ENDPOINT: ${{ secrets.AZURE_LANGUAGE_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Pular quando não há credenciais
        if: env.AZURE_SPEECH_KEY == '' || env.AZURE_LANGUAGE_KEY == ''
        run: echo "::notice::Secrets do Azure não configurados — teste de integração ignorado."
      - if: env.AZURE_SPEECH_KEY != '' && env.AZURE_LANGUAGE_KEY != ''
        run: pip install -r requirements.txt && python scripts/azure_smoke_test.py

  docker:
    needs: [test, pipeline]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
